[workspace]
resolver = "2"
members = [
    "crates/mmce-config",
    "crates/mmce-codecs",
    "crates/mmce-core",
    "crates/mmce-filters",
    "crates/mmce-render",
    "crates/mmce-store",
    "crates/mmce-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
# Shared across crates
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }

# Codecs
image = { version = "0.25", default-features = false, features = [
    "jpeg", "png", "gif", "bmp", "webp", "tiff",
] }
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"] }
sevenz-rust2 = "0.17"
tar = "0.4"
natord = "1.0"

# GUI
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts", "glow", "wayland", "x11",
] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# INI
encoding_rs = "0.8"

# Persistence
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
