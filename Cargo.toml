[workspace]
resolver = "2"
members = [
    "crates/mmce-config",
    "crates/mmce-codecs",
    "crates/mmce-core",
    "crates/mmce-filters",
    "crates/mmce-render",
    "crates/mmce-store",
    "crates/mmce-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
# Shared across crates
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }

# Codecs
image = { version = "0.25", default-features = false, features = [
    "jpeg", "png", "gif", "bmp", "webp", "tiff",
] }
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"] }
# Pull flate2 to the workspace with the zlib-rs backend. zip (via the
# `deflate` feature) and png both depend on flate2 transitively with the
# default miniz_oxide backend — this override picks the pure-Rust
# SIMD-accelerated zlib-rs port instead (PCLMUL CRC32, SSE4.2 inflate).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
sevenz-rust2 = "0.17"
tar = "0.4"
natord = "1.0"
# libjpeg-turbo (SIMD) for DCT-domain downscale decode of cover thumbnails.
# JPEG-only fast path with a zune-jpeg fallback (mmce-codecs::decode_cover_image);
# needs `nasm` at build time — wired into flake.nix nativeBuildInputs.
mozjpeg = "0.10"

# GUI
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts", "glow", "wayland", "x11",
] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

# INI
encoding_rs = "0.8"

# Persistence
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
